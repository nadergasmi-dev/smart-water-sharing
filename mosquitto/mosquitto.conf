# Broker Smart Water Sharing : accès authentifié + ACL (CONTRAT.md, section 2.1)
#
# À lancer DEPUIS LA RACINE DU PROJET (les chemins ci-dessous sont relatifs) :
#     mosquitto -c mosquitto/mosquitto.conf -v
# Le service Windows « mosquitto » utilise le port 1883 en accès anonyme :
# l'arrêter d'abord (net stop mosquitto, en administrateur).
# Les comptes sont créés par mosquitto/setup.ps1.

listener 1883 localhost
allow_anonymous false
password_file mosquitto/passwd
acl_file mosquitto/acl
